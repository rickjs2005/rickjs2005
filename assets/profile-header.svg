<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Rick JS — Full-Stack Software Engineer</title>
  <desc id="desc">Technical profile banner showing a production software architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0D"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B860"/>
      <stop offset="1" stop-color="#FFE0A3"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <path d="M0 286H1200" stroke="#FFFFFF" stroke-opacity=".08"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(56 48)">
      <rect width="242" height="30" rx="15" fill="#F4B860" fill-opacity=".1" stroke="#F4B860" stroke-opacity=".35"/>
      <circle cx="18" cy="15" r="4" fill="#4ADE80" filter="url(#glow)"/>
      <text x="32" y="20" fill="#F4B860" font-size="11" font-weight="700" letter-spacing="1.4">AVAILABLE FOR ENGINEERING</text>
    </g>

    <text x="56" y="146" fill="#F7F4EC" font-size="62" font-weight="800" letter-spacing="-2">RICK JS</text>
    <text x="58" y="181" fill="#A9B0BC" font-size="20" font-weight="500" letter-spacing=".6">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="58" y="221" fill="#E7E2D8" font-size="15">SaaS systems · APIs · Multi-tenancy · Automation</text>

    <g transform="translate(56 247)" font-size="11" font-weight="700" letter-spacing=".6">
      <g><rect width="106" height="28" rx="6" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="14" y="18" fill="#CFD4DC">TYPESCRIPT</text></g>
      <g transform="translate(116)"><rect width="88" height="28" rx="6" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="14" y="18" fill="#CFD4DC">NODE.JS</text></g>
      <g transform="translate(214)"><rect width="108" height="28" rx="6" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="14" y="18" fill="#CFD4DC">POSTGRESQL</text></g>
      <g transform="translate(332)"><rect width="82" height="28" rx="6" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".11"/><text x="14" y="18" fill="#CFD4DC">REACT</text></g>
    </g>

    <g transform="translate(684 43)">
      <text x="0" y="0" fill="#6F7783" font-size="10" font-weight="700" letter-spacing="1.6">SYSTEM MAP / 01</text>

      <g transform="translate(0 27)">
        <path d="M100 32H160M270 32H330M215 62V94M385 62V94M215 126V158M385 126V158" fill="none" stroke="#F4B860" stroke-opacity=".62" stroke-width="1.5"/>
        <circle cx="130" cy="32" r="3" fill="#F4B860"/>
        <circle cx="300" cy="32" r="3" fill="#F4B860"/>
        <circle cx="215" cy="78" r="3" fill="#F4B860"/>
        <circle cx="385" cy="78" r="3" fill="#F4B860"/>

        <g>
          <rect width="100" height="64" rx="10" fill="#11151B" stroke="#FFFFFF" stroke-opacity=".14"/>
          <text x="16" y="25" fill="#737C89" font-size="9" font-weight="700" letter-spacing="1">CLIENT</text>
          <text x="16" y="45" fill="#E8E4DB" font-size="13" font-weight="600">Web / Mobile</text>
        </g>
        <g transform="translate(160)">
          <rect width="110" height="64" rx="10" fill="#171A20" stroke="#F4B860" stroke-opacity=".52"/>
          <text x="16" y="25" fill="#F4B860" font-size="9" font-weight="700" letter-spacing="1">ENTRY</text>
          <text x="16" y="45" fill="#F7F4EC" font-size="13" font-weight="600">API Layer</text>
        </g>
        <g transform="translate(330)">
          <rect width="110" height="64" rx="10" fill="#171A20" stroke="#F4B860" stroke-opacity=".52"/>
          <text x="16" y="25" fill="#F4B860" font-size="9" font-weight="700" letter-spacing="1">CORE</text>
          <text x="16" y="45" fill="#F7F4EC" font-size="13" font-weight="600">Use Cases</text>
        </g>

        <g transform="translate(160 94)">
          <rect width="110" height="64" rx="10" fill="#11151B" stroke="#FFFFFF" stroke-opacity=".14"/>
          <text x="16" y="25" fill="#737C89" font-size="9" font-weight="700" letter-spacing="1">DATA</text>
          <text x="16" y="45" fill="#E8E4DB" font-size="13" font-weight="600">PostgreSQL</text>
        </g>
        <g transform="translate(330 94)">
          <rect width="110" height="64" rx="10" fill="#11151B" stroke="#FFFFFF" stroke-opacity=".14"/>
          <text x="16" y="25" fill="#737C89" font-size="9" font-weight="700" letter-spacing="1">ASYNC</text>
          <text x="16" y="45" fill="#E8E4DB" font-size="13" font-weight="600">Workers</text>
        </g>

        <g transform="translate(160 158)">
          <rect width="110" height="42" rx="9" fill="#0E1217" stroke="#FFFFFF" stroke-opacity=".1"/>
          <circle cx="17" cy="21" r="4" fill="#4ADE80"/>
          <text x="30" y="26" fill="#AEB5C0" font-size="11" font-weight="600">OBSERVABLE</text>
        </g>
        <g transform="translate(330 158)">
          <rect width="110" height="42" rx="9" fill="#0E1217" stroke="#FFFFFF" stroke-opacity=".1"/>
          <circle cx="17" cy="21" r="4" fill="#4ADE80"/>
          <text x="30" y="26" fill="#AEB5C0" font-size="11" font-weight="600">TESTED</text>
        </g>
      </g>
    </g>

    <text x="56" y="316" fill="#6D7480" font-size="10" font-weight="700" letter-spacing="1.8">DOMAIN FIRST</text>
    <text x="177" y="316" fill="#3E454F" font-size="10">/</text>
    <text x="196" y="316" fill="#6D7480" font-size="10" font-weight="700" letter-spacing="1.8">TYPE SAFE</text>
    <text x="300" y="316" fill="#3E454F" font-size="10">/</text>
    <text x="319" y="316" fill="#6D7480" font-size="10" font-weight="700" letter-spacing="1.8">PRODUCTION READY</text>
  </g>
</svg>