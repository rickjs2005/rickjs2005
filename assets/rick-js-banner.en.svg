  <radialGradient id="glow"><stop stop-color="#b88b42" stop-opacity=".18"/><stop offset="1" stop-color="#b88b42" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#c6a66f" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>
