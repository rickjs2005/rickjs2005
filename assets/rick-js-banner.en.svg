<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Rick JS — full-stack developer, founder of MilWeb</title>
<desc id="desc">Dark cover with gold details: Rick JS, full-stack developer and founder of MilWeb. Solid systems. Memorable experiences. Products, interfaces, motion and 3D.</desc>
<defs>
